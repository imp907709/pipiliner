services:
  postgres:
    image: postgres:16-alpine
    container_name: satellite-postgres
    environment:
      POSTGRES_DB: satellite_pipeline
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
    ports:
      - "6432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d satellite_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - satellite-pipeline

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: satellite-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: pipeline
      RABBITMQ_DEFAULT_PASS: pipeline
    ports:
      - "6672:5672"
      - "16672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - satellite-pipeline

  minio:
    image: minio/minio:latest
    container_name: satellite-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pipeline
      MINIO_ROOT_PASSWORD: pipeline123
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - satellite-pipeline

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: satellite-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:6080
      DOTNET_ENVIRONMENT: Docker
      Infrastructure__PostgresConnectionString: Host=postgres;Port=5432;Database=satellite_pipeline;Username=pipeline;Password=pipeline
      Infrastructure__RabbitMqHost: rabbitmq
      Infrastructure__RabbitMqPort: 5672
      Infrastructure__RabbitMqUser: pipeline
      Infrastructure__RabbitMqPassword: pipeline
      Infrastructure__MinioEndpoint: http://minio:9000
      Infrastructure__MinioAccessKey: pipeline
      Infrastructure__MinioSecretKey: pipeline123
      Infrastructure__MinioBucket: satellite
    ports:
      - "6180:6080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - satellite-pipeline

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: satellite-worker
    environment:
      DOTNET_ENVIRONMENT: Docker
      RUN_BACKFILL_ON_STARTUP: "false"
      Infrastructure__PostgresConnectionString: Host=postgres;Port=5432;Database=satellite_pipeline;Username=pipeline;Password=pipeline
      Infrastructure__RabbitMqHost: rabbitmq
      Infrastructure__RabbitMqPort: 5672
      Infrastructure__RabbitMqUser: pipeline
      Infrastructure__RabbitMqPassword: pipeline
      Infrastructure__MinioEndpoint: http://minio:9000
      Infrastructure__MinioAccessKey: pipeline
      Infrastructure__MinioSecretKey: pipeline123
      Infrastructure__MinioBucket: satellite
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - satellite-pipeline

volumes:
  postgres_data:
  minio_data:

networks:
  satellite-pipeline:
    name: satellite-pipeline
